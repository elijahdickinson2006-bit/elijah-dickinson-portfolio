<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Elijah Dickinson | Aerospace & Mechanical Engineering</title>
</head>
<body>
<script>
(async()=>{
  const root='https://raw.githubusercontent.com/elijahdickinson2006-bit/elijah-dickinson-portfolio/main/';
  const stamp=Date.now();
  const [pageRes,themeRes]=await Promise.all([
    fetch(root+'index-source.html?v='+stamp,{cache:'no-store'}),
    fetch(root+'theme.css?v='+stamp,{cache:'no-store'})
  ]);
  let page=await pageRes.text();
  const theme=await themeRes.text();

  const copyUpdates=[
    [
      'Oklahoma State University engineering student building <strong>real hardware</strong> at the intersection of aerodynamics, mechanical design, fabrication, instrumentation, and embedded systems.',
      'I’m an aerospace and mechanical engineering student at Oklahoma State, and I like projects I can actually <strong>build, test, and improve.</strong> Most of my work focuses on aerodynamics, mechanical design, fabrication, instrumentation, and embedded systems.'
    ],
    [
      'An independent benchtop wind-tunnel build designed around a simple objective: create a compact system that can condition airflow, support repeatable aerodynamic testing, and produce useful force and pressure measurements without access to a full machine shop.',
      'I started this project to see how far I could take a benchtop wind tunnel with basic tools and a student budget. The goal is to get clean, repeatable airflow and use it to collect useful force and pressure data.'
    ],
    [
      'Designed the complete flow path',
      'Built the full flow path'
    ],
    [
      'Developed a 12 × 12 in inlet, honeycomb and dual-screen conditioning section, 4:1 contraction, clear acrylic test chamber, diffuser, and inline-fan arrangement around a compact benchtop footprint.',
      'I laid out the tunnel from the 12 × 12 in inlet through the honeycomb and screens, 4:1 contraction, clear test section, diffuser, and inline fan while keeping the whole build compact enough for a benchtop setup.'
    ],
    [
      'Worked through fabrication error',
      'Fixed problems as they showed up'
    ],
    [
      'Measured fit-up problems, corrected out-of-square transition geometry, revised fastening strategies, and developed sealing methods around real panel tolerances instead of treating fabrication as ideal.',
      'Not everything came out square on the first try. I measured the fit-up issues, rebuilt sections that needed it, changed how I fastened panels together, and figured out sealing methods that worked with the parts I actually had.'
    ],
    [
      'Leak-tested assembled sections',
      'Tested each section as I built it'
    ],
    [
      'Sealed and tested the inlet and contraction individually and after joining them, while revising the fan architecture from suction to push when tooling constraints made the original outlet configuration impractical.',
      'I leak-tested the inlet and contraction on their own and again after joining them. I also changed the fan from a pull setup to a push setup when the original layout became impractical with the tools I had available.'
    ],
    [
      'A mechanical-design team project combining CAD, 3D-printed hardware, drivetrain components, electronics, and autonomous C++ control into a functioning competition robot.',
      'This was a team design project where we had to turn CAD, 3D-printed parts, electronics, drivetrain hardware, and Arduino code into a robot that actually worked in the course environment.'
    ],
    [
      'Mechanical + project contribution',
      'What I worked on'
    ],
    [
      'Led planning and task coordination, designed mechanical components in SolidWorks, prepared and revised 3D-printed parts, programmed Arduino control logic in C++, and supported mechanical-electrical integration during testing.',
      'I handled a lot of the planning and coordination, designed parts in SolidWorks, revised 3D-printed components, wrote Arduino control code in C++, and helped troubleshoot the mechanical and electrical systems during testing.'
    ],
    [
      'Integration under test',
      'Getting everything to work together'
    ],
    [
      'Coordinated drivetrain hardware, actuators, sensors, relay modules, wiring, structural components, and autonomous timing logic into a working robot through iterative assembly and troubleshooting.',
      'A big part of the project was getting the drivetrain, actuators, sensors, relays, wiring, structure, and timing logic to behave as one system. Most of that came down to building, testing, finding what failed, and trying again.'
    ],
    [
      'The site is the overview. These files show the engineering underneath it: the current resume, session-by-session wind-tunnel notes, and the costed bill of materials used to manage the build.',
      'The site gives the quick version. These files show more of the actual work behind it, including my resume, the wind-tunnel build log, and the bill of materials I used to track parts and cost.'
    ],
    [
      'Engineering that survives contact with reality.',
      'I like building things I can actually test.'
    ],
    [
      'I am pursuing B.S. degrees in Aerospace Engineering and Mechanical Engineering with a minor in Mathematics at Oklahoma State University. I am most interested in work where analysis turns into hardware: designing, building, testing, measuring, troubleshooting, and improving systems until they actually work.',
      'I’m studying aerospace and mechanical engineering at Oklahoma State with a minor in mathematics. The work I enjoy most is the kind where I can take an idea from analysis or CAD into something physical, test it, figure out what is wrong, and make the next version better.'
    ],
    [
      'Want the technical details?',
      'Want to talk engineering?'
    ],
    [
      'For internships, engineering opportunities, or questions about one of the projects, email me directly or review the source and project files on GitHub.',
      'If you want to talk about an internship, an engineering opportunity, or one of these projects, feel free to email me or take a look through the project files on GitHub.'
    ]
  ];

  copyUpdates.forEach(([from,to])=>{page=page.split(from).join(to)});
  page=page.replace('<meta name="theme-color" content="#090b0e">','<meta name="theme-color" content="#ffffff">');
  page=page.replace('</head>',`<base href="${root}"><style id="blue-white-theme">${theme}</style></head>`);
  document.open();document.write(page);document.close();
})().catch(err=>{document.body.innerHTML='<main style="font-family:system-ui;padding:40px"><h1>Portfolio loading error</h1><p>Please refresh the page.</p></main>';console.error(err)});
</script>
</body>
</html>
