<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Elijah Dickinson | Aerospace & Mechanical Engineering</title>
</head>
<body>
<script>
(async()=>{
  const root='https://raw.githubusercontent.com/elijahdickinson2006-bit/elijah-dickinson-portfolio/main/';
  const stamp=Date.now();
  const [pageRes,themeRes]=await Promise.all([
    fetch(root+'index-source.html?v='+stamp,{cache:'no-store'}),
    fetch(root+'theme.css?v='+stamp,{cache:'no-store'})
  ]);
  let page=await pageRes.text();
  const theme=await themeRes.text();
  page=page.replace('<meta name="theme-color" content="#090b0e">','<meta name="theme-color" content="#ffffff">');
  page=page.replace('</head>',`<base href="${root}"><style id="blue-white-theme">${theme}</style></head>`);
  document.open();document.write(page);document.close();
})().catch(err=>{document.body.innerHTML='<main style="font-family:system-ui;padding:40px"><h1>Portfolio loading error</h1><p>Please refresh the page.</p></main>';console.error(err)});
</script>
</body>
</html>
